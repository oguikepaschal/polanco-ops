name: Apply Supabase migrations

# Runs db push automatically on merge to main so a migration committed to the
# repo can never again silently fail to reach production the way
# add_activity_log.sql did — that file sat in supabase/migrations/ for days
# while the table it creates never existed in prod, because nothing applied it.
on:
  push:
    branches: [main]
    paths:
      - "polanco-ops/supabase/migrations/**"
  # Manual trigger so the secrets/auth path can be validated on demand without
  # waiting for a real migration push. Note: GitHub only allows dispatching a
  # workflow once it exists on the default branch, so this is usable after merge.
  workflow_dispatch:
    inputs:
      # For migrations that were run by hand in the SQL editor: records them in
      # the CLI's migration history first, so db push doesn't try to replay them
      # (most older migrations use plain `add column` / `create table` and fail
      # on a second run). Only list versions that are actually live in the
      # database — anything listed here is never applied by this workflow.
      mark_applied:
        description: "Space-separated migration versions already applied by hand (e.g. 20260601000000 20260623000000). Leave empty to just push."
        required: false
        default: ""
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        working-directory: polanco-ops
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Record hand-applied migrations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mark_applied != '' }}
        working-directory: polanco-ops
        # Passed through env (not interpolated into the script) so the input
        # can't inject shell. Word-splitting on $MARK_APPLIED is intentional.
        run: supabase migration repair --status applied $MARK_APPLIED
        env:
          MARK_APPLIED: ${{ inputs.mark_applied }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        working-directory: polanco-ops
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
